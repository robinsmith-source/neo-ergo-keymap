name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: scripts/render.sh
      # Publish as a single orphan commit so main never carries generated files.
      - if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w build/keymap.svg)
          tree=$(printf '100644 blob %s\tkeymap.svg\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: render keymap")
          git push --force origin "$commit:refs/heads/images"

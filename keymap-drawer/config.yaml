parse_config:
  # Setting qmk_keycode_map replaces keymap-drawer's built-in map, so the defaults are repeated below.
  qmk_keycode_map:
    # Neo Ergo specifics and personal label choices
    GESC:
      t: Esc
      s: '`'
    FN_MO13: Fn
    CUSTOM(0): BT 1
    CUSTOM(1): BT 2
    CUSTOM(2): BT 3
    CUSTOM(3): 2.4G
    CUSTOM(4): USB
    CUSTOM(5): Mode
    NUBS: \
    NUHS: '#'
    MPLY: Play
    MPRV: Prev
    MNXT: Next
    MUTE: Mute
    VOLU: Vol+
    VOLD: Vol-
    UP: ↑
    DOWN: ↓
    LEFT: ←
    RGHT: →
    ENT: Enter
    BSPC: Bksp
    SPC: Space
    # keymap-drawer defaults
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
draw_config:
  # Styled after the real board: white case, GMK CYL Extended 2048 dark caps with colored mods, golden weight.
  dark_mode: false
  draw_key_sides: true
  svg_extra_style: |
    svg.keymap { background-color: #dcdad5; fill: #ecebe7; }
    rect.key, rect.side { fill: #3b3c3f; stroke: #2a2b2d; }
    rect.side { filter: brightness(70%); }
    text.trans { fill: #8d8f93; }
    rect.held, rect.side.held { fill: #c9a45c; }
    .keypos-0 rect, .keypos-59 rect { fill: #ec6e70; stroke: #b9524f; }
    .keypos-44 rect, .keypos-57 rect { fill: #e5b82a; stroke: #b08a17; }
    .keypos-60 rect { fill: #9a84cf; stroke: #7462a8; }
    .keypos-61 rect, .keypos-64 rect { fill: #5fb0de; stroke: #3f8bb5; }
    .keypos-41 rect { fill: #74c4a0; stroke: #4f9c7a; }
    .keypos-0 text, .keypos-41 text, .keypos-44 text, .keypos-57 text,
    .keypos-59 text, .keypos-60 text, .keypos-61 text, .keypos-64 text { fill: #2a2b2d; }
    text.label { fill: #2a2b2d; stroke: #dcdad5; }
